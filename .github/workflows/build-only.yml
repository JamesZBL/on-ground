name: Build Only (No Deploy)

on:
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (without API Key)
        run: npm run build

      - name: Check build output
        run: |
          if [ ! -f "config.js" ]; then
            echo "❌ 构建失败: config.js 未生成"
            exit 1
          fi
          echo "✅ 构建成功"
